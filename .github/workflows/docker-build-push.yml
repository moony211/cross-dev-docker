name: Docker Build and Push

on:
  push:
    branches: [main]
    paths:
      - "jetpack-cross-dev/VERSION"
      - "qt-host/6.7.3/VERSION"
      - "qt-host/6.8.3/VERSION"
      - "qt-target/6.7.3/VERSION"
      - "qt-target/6.8.3/VERSION"
      - "target-rfs/VERSION"
  workflow_dispatch:
    inputs:
      image-tag:
        description: "Default image tag (if VERSION file is missing)"
        required: false
        default: "latest"

jobs:
  build:
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Git diff를 위해 모든 커밋 히스토리를 가져옵니다. (fatal: bad object 에러 해결)
          fetch-depth: 0        

      - name: Set up Docker Buildx
        run: |
          # BuildKit이 HTTP 기반의 사설 레지스트리를 허용하도록 설정 파일을 생성합니다.
          cat <<EOF > buildkitd.toml
          [registry."docker-reg.posod.com:5000"]
            http = true
          [registry."192.168.15.67:5000"]
            http = true
          EOF

          # 기존 빌더가 있으면 사용하고, 없으면 새로 생성합니다.
          docker buildx create --use --name mybuilder --config buildkitd.toml --driver-opt network=host || docker buildx use mybuilder
          
          # 빌더를 초기화하여 설정을 적용합니다.
          docker buildx inspect --bootstrap

      - name: Build and push images
        run: |
          chmod +x scripts/build-and-push-images.sh
          
          TARGETS=""
          if [ "${{ github.event_name }}" == "push" ]; then
            # Get the list of changed VERSION files and extract their directories
            CHANGED_FILES=$(git diff --name-only ${{ github.event.before }} ${{ github.event.after }} | grep 'VERSION$' || true)
            if [ -n "$CHANGED_FILES" ]; then
              for file in $CHANGED_FILES; do
                TARGETS="$TARGETS $(dirname $file)"
              done
            fi
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            export IMAGE_TAG="${{ github.event.inputs.image-tag }}"
          fi

          echo "Target directories to build: $TARGETS"
          ./scripts/build-and-push-images.sh $TARGETS
        env:
          REGISTRY_HOST: docker-reg.posod.com:5000
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
